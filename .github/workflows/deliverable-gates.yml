name: deliverable-gates
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  gates-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Isomorphic gate selftests
        run: node scripts/gates/selftest.mjs
